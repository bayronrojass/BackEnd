services:
  backend:
    build: ./Backend
    container_name: PIN_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/mi_db
      - SPRING_DATASOURCE_USERNAME=usuario
      - SPRING_DATASOURCE_PASSWORD=clave
      - MULTIMEDIA_DIR=/multimedia
      - MQTT_BROKER=tcp://mqtt:1883
      # Esta es la variable que protege tu BD de 'create-drop'
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    volumes:
      - ./multimedia:/multimedia
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: PIN_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mi_db
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: clave
    volumes:
      - ./db-data:/var/lib/postgresql/data # ¡Correcto! Tus datos están a salvo.
    ports:
      - "5433:5432" # ¡Correcto! Usando el puerto 5433.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d mi_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: PIN_MQTT
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:rw # ¡Correcto! Carga el .conf
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/logs:/mosquitto/logs:rw
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t 'health/check' -m 'ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
