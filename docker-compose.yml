services:
  backend:
    build: ./Backend
    container_name: PIN_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/mi_db
      - SPRING_DATASOURCE_USERNAME=usuario
      - SPRING_DATASOURCE_PASSWORD=clave
      - MULTIMEDIA_DIR=/multimedia
      - MQTT_BROKER=tcp://mqtt:1883
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
    volumes:
      - ./multimedia:/multimedia
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: PIN_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mi_db
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: clave
    #volumes:
    # - ./db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d mi_db"]
      interval: 5s
      timeout: 5s
      retries: 10

