spring.application.name=backend

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.main.web-application-type=servlet
java.awt.headless=true

# Hibernate y JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Directorios
multimedia_dir=${MULTIMEDIA_DIR:./multimedia}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Suppress automatic REST exposure of JPA repositories
spring.data.rest.detection-strategy=annotated

# JWT configuration
jwt.secret=${JWT_SECRET:mirumi-dev-jwt-secret-key-change-me-in-production-abcdef0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
