name: DAST Scan (OWASP ZAP)

on: [push]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan Application
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create Firebase Config
        run: echo "${{ secrets.FIREBASE_JSON_CONTENT }}" > firebase-config.json
      - name: Start Application
        run: |
          docker compose up -d backend
          # Esperar a que el puerto 8080 responda (healthcheck simple)
          timeout 60s sh -c 'until curl -s http://localhost:8080/health > /dev/null; do sleep 5; done'

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080'
          fail_action: false
          allow_issue_writing: false # Evita que ZAP cree Issues en tu repo automáticamente

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: ZAP HTML Report
          path: report_html.html