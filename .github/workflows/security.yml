name: DAST Scan (OWASP ZAP)

on: [push]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan Application
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Firebase Config
        run: |
          mkdir -p Backend # Aseguramos que la carpeta exista
          echo '${{ secrets.FIREBASE_CONFIG }}' > ./Backend/firebase-config.json

      - name: Start Application Container
        run: |
          docker compose up -d --build backend
          
          echo "Esperando a que la aplicación arranque..."
          # Intentamos conectar a la raíz (/) o a /health durante 60 segundos
          timeout 60s sh -c 'until curl -m 5 -s http://localhost:8080/ > /dev/null; do sleep 5; done'

      - name: Fix file permissions for ZAP
        run: |
          chmod -R 777 ./Backend
          touch report-html.html
          chmod 666 report-html.html

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080'
          fail_action: false
          allow_issue_writing: true
          artifact_name: 'zap-scan-report'
          cmd_options: '-a'

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: report-html.html